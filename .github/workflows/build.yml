# Automatically build the project and run any configured tests for every push
# and submitted pull request. This can help catch issues that only occur on
# certain platforms or Java versions, and provides a first line of defence
# against bad commits.

name: build
on: [pull_request, push]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v6
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      # Builds every Minecraft version in settings.gradle.kts and collects the jars into
      # build/libs/<mod version>/. Plain `build` also builds them all, but leaves each jar
      # under versions/<mc version>/build/libs/.
      - name: build
        run: ./gradlew buildAndCollect
      # v4, not v7: Gitea runs this workflow too (it reads .github/workflows as well as
      # .gitea/workflows), and act_runner cannot resolve v7 - it is what failed every
      # previous run on this repo, always after the Gradle build had already succeeded.
      - name: capture build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Artifacts
          path: build/libs/*/*.jar
