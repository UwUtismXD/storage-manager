# Automatically build the project and run any configured tests for every push
# and submitted pull request. This can help catch issues that only occur on
# certain platforms or Java versions, and provides a first line of defence
# against bad commits.

name: build
on: [pull_request, push]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v6
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      # Builds every Minecraft version in settings.gradle.kts and collects the jars into
      # build/libs/<mod version>/. Plain `build` also builds them all, but leaves each jar
      # under versions/<mc version>/build/libs/.
      - name: build
        run: ./gradlew buildAndCollect
      # v3, not v4 or v7:
      #   * v4+ rejects with GHESNotSupportedError on the GHES instance at
      #     192.168.8.76:3030 (the artifact backend the v4 client expects is not
      #     supported by that GHES version).
      #   * v7 cannot be resolved by Gitea's act_runner, which also reads this file
      #     alongside .gitea/workflows. v7 was what failed every previous run on this
      #     repo, always after the Gradle build had already succeeded.
      # v3 is the lowest common denominator that uploads fine on both backends.
      - name: capture build artifacts
        uses: actions/upload-artifact@v3
        with:
          name: Artifacts
          path: build/libs/*/*.jar
