# Builds the mod for every Minecraft version declared in settings.gradle.kts and
# uploads the jars as run artifacts.
#
# Requires Gitea Actions to be enabled and at least one act_runner registered with a
# label this job can match (see `runs-on` below). Check Settings -> Actions -> Runners
# on the instance if a push produces no run at all.

name: build
on: [push, pull_request]

jobs:
  build:
    # ubuntu-24.04 is the label this instance's runner has actually executed jobs with.
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v4

      - name: setup jdk
        uses: actions/setup-java@v4
        with:
          # 26.1.2 targets Java 25; a 25 toolchain also builds the Java 21 target.
          java-version: '25'
          distribution: 'temurin'

      # Each version downloads and remaps its own Minecraft, so an uncached run pulls
      # several hundred MB twice. Worth caching even for a repo this small.
      - name: cache gradle and loom
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', 'stonecutter.properties.toml', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: make gradle wrapper executable
        run: chmod +x ./gradlew

      # Runs the JUnit 5 test suite before building. A failing test blocks the jar so
      # we never ship one that breaks the queue/sort/random logic.
      - name: run tests
        run: ./gradlew test

      # Builds every version and copies the jars into build/libs/<mod version>/ so the
      # upload below doesn't have to know the version list.
      - name: build all versions
        run: ./gradlew buildAndCollect --stacktrace

      # Pinned to v3: the v4 client throws GHESNotSupportedError against the artifact
      # backend (ACTIONS_RESULTS_URL points at GHES at 192.168.8.76:3030, which doesn't
      # speak the v2+ @actions/artifact protocol). The env override below is still
      # required because gitea/runner:nightly (v3.1.0+6-gdbd9a892) sets ACTIONS_RESULTS_URL
      # to its own cache server instead of Gitea, so CreateArtifact would otherwise hit a
      # port that never answers. Drop the override once the runner sets the variable
      # correctly - ACTIONS_RUNTIME_URL is already right.
      - name: capture build artifacts
        uses: actions/upload-artifact@v3
        env:
          ACTIONS_RESULTS_URL: http://192.168.8.76:3030/
        with:
          name: jars
          path: build/libs/*/*.jar
          if-no-files-found: error
