<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Storage Manager</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #14161b;
    --panel: #1d2028;
    --border: #2c303a;
    --text: #e6e8ee;
    --muted: #8b91a1;
    --accent: #5b8cff;
    --accent-text: #0b0e14;
    --danger: #ff6b6b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, Segoe UI, Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 24px;
  }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .sub { color: var(--muted); margin: 0 0 24px; font-size: 13px; }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; align-items: start; }
  @media (max-width: 800px) { .grid { grid-template-columns: 1fr; } }
  .col { display: flex; flex-direction: column; gap: 16px; }
  .panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px;
  }
  .panel h2 { font-size: 14px; margin: 0 0 12px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.04em; }
  label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 4px; }
  input[type=text], input[type=number] {
    width: 100%;
    background: #10131a;
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text);
    padding: 6px 8px;
    font-size: 13px;
  }
  .row { display: flex; gap: 8px; margin-bottom: 10px; }
  .row > div { flex: 1; }
  button {
    background: var(--accent);
    color: var(--accent-text);
    border: none;
    border-radius: 6px;
    padding: 8px 14px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
  }
  button.secondary { background: transparent; color: var(--text); border: 1px solid var(--border); }
  button.danger { background: var(--danger); color: var(--accent-text); }
  button:hover { filter: brightness(1.1); }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 6px 4px; border-bottom: 1px solid var(--border); }
  th { color: var(--muted); font-weight: 500; }
  .status-line { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; font-size: 13px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); }
  .dot.paused { background: var(--danger); }
  .actions { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
  label.check {
    display: flex; align-items: center; gap: 6px; margin: 12px 0 0;
    font-size: 12px; color: var(--muted); cursor: pointer;
  }
  .search { margin-bottom: 10px; }
  .withdraw-head { text-align: right; }
  .withdraw-cell { display: flex; gap: 6px; justify-content: flex-end; }
  .withdraw-cell input[type=number] { width: 68px; padding: 4px 6px; font-size: 12px; }
  .withdraw-cell button { padding: 4px 10px; font-size: 12px; }
  .empty-note { color: var(--muted); font-size: 13px; padding: 16px 0; }
</style>
</head>
<body>
  <h1>Storage Manager</h1>
  <p class="sub">Baritone-powered storage bot control panel &middot; <a href="/chests">Browse chests &rarr;</a></p>

  <div class="grid">
    <!-- Two explicit columns rather than letting three panels flow: the inventory is much
         taller than the others, so auto-placement left a dead gap under the status panel. -->
    <div class="col">
    <div class="panel">
      <h2>Status</h2>
      <div class="status-line"><span class="dot" id="statusDot"></span><span id="statusText">loading...</span></div>
      <div id="queueText" class="sub"></div>
      <div id="warningText" class="sub" style="color: var(--danger); display: none;"></div>
      <div class="actions">
        <button onclick="post('/api/scan')">Rescan storage</button>
        <button onclick="post('/api/sort')">Sort input chest</button>
        <button class="secondary" onclick="randomize()">Randomize storage</button>
        <button class="danger" onclick="post('/api/stop')"
                title="Cancels the running job and the whole queue, then puts anything the bot is carrying into the nearest chest with room">Stop</button>
      </div>
      <label class="check" title="Every 2-5 minutes with nothing queued, the bot strolls to a random chest instead of standing still">
        <input type="checkbox" id="wander" onchange="setWander()"> Wander around storage when idle
      </label>
    </div>

    <div class="panel">
      <h2>Setup</h2>
      <label>Region min (x, y, z)</label>
      <div class="row">
        <div><input type="number" id="minX" placeholder="x"></div>
        <div><input type="number" id="minY" placeholder="y"></div>
        <div><input type="number" id="minZ" placeholder="z"></div>
      </div>
      <label>Region max (x, y, z)</label>
      <div class="row">
        <div><input type="number" id="maxX" placeholder="x"></div>
        <div><input type="number" id="maxY" placeholder="y"></div>
        <div><input type="number" id="maxZ" placeholder="z"></div>
      </div>
      <label>Input chest (x, y, z)</label>
      <div class="row">
        <div><input type="number" id="inX" placeholder="x"></div>
        <div><input type="number" id="inY" placeholder="y"></div>
        <div><input type="number" id="inZ" placeholder="z"></div>
      </div>
      <label>Output chest (x, y, z)</label>
      <div class="row">
        <div><input type="number" id="outX" placeholder="x"></div>
        <div><input type="number" id="outY" placeholder="y"></div>
        <div><input type="number" id="outZ" placeholder="z"></div>
      </div>
      <button class="secondary" onclick="saveSetup()">Save setup</button>
      <button class="danger" onclick="clearChestIndex()"
              title="Removes cached chest locations and contents but keeps this setup">Clear indexed chests</button>
    </div>
    </div>

    <div class="col">
    <div class="panel">
      <h2>Inventory</h2>
      <input class="search" type="text" id="search" placeholder="Filter items..." oninput="renderInventory()">
      <table>
        <thead><tr><th>Item</th><th>Count</th><th class="withdraw-head">Withdraw to output</th></tr></thead>
        <tbody id="inventoryBody"></tbody>
      </table>
    </div>
    </div>
  </div>

<script>
let totals = {};

async function post(path, body) {
  await fetch(path, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: body ? JSON.stringify(body) : undefined
  });
  refreshStatus();
}

// Counts typed into the inventory rows, keyed by item id. Held outside the table because
// renderInventory() rebuilds every row on each 10s refresh, which would otherwise wipe them.
const withdrawCounts = {};

async function withdrawItem(item, count) {
  if (!item || !Number.isFinite(count) || count < 1) return;
  await post('/api/withdraw', { item, count });
}

// Guards the checkbox against being reverted by a status poll that's already in flight.
let wanderPending = false;

async function setWander() {
  wanderPending = true;
  try {
    await post('/api/wander', { enabled: document.getElementById('wander').checked });
  } finally {
    wanderPending = false;
  }
}

// Reshuffling every chest has no undo, so make a misclick harder. It's one visit per chest now,
// but that's still a walk around the whole storage room.
async function randomize() {
  if (!confirm('Redistribute every known item into random chests? Stop cancels it partway.')) return;
  await post('/api/randomize');
}

function num(id) {
  const v = document.getElementById(id).value;
  return v === '' ? 0 : parseInt(v, 10);
}

async function saveSetup() {
  await post('/api/setup', {
    region: {
      min: { x: num('minX'), y: num('minY'), z: num('minZ') },
      max: { x: num('maxX'), y: num('maxY'), z: num('maxZ') }
    },
    inputChest: { x: num('inX'), y: num('inY'), z: num('inZ') },
    outputChest: { x: num('outX'), y: num('outY'), z: num('outZ') }
  });
}

async function clearChestIndex() {
  if (!confirm('Remove every cached chest and its contents? Your region, input, and output settings will be kept. Run a rescan afterwards.')) return;
  await post('/api/chests/clear');
  await refreshInventory();
}

// Built with DOM calls rather than an innerHTML template so item ids - which end up in both
// a value and a click handler - never need escaping.
function renderInventory() {
  const filter = document.getElementById('search').value.toLowerCase();
  const body = document.getElementById('inventoryBody');
  body.innerHTML = '';

  const rows = Object.entries(totals)
    .filter(([item]) => item.toLowerCase().includes(filter))
    .sort((a, b) => b[1] - a[1]);

  if (!rows.length) {
    const tr = document.createElement('tr');
    const td = document.createElement('td');
    td.colSpan = 3;
    td.className = 'empty-note';
    td.textContent = Object.keys(totals).length
      ? 'No items match that filter.'
      : 'Storage is empty. Run a rescan to index what is out there.';
    tr.appendChild(td);
    body.appendChild(tr);
    return;
  }

  for (const [item, count] of rows) {
    const nameCell = document.createElement('td');
    nameCell.textContent = item;

    const countCell = document.createElement('td');
    countCell.textContent = count;

    const qty = document.createElement('input');
    qty.type = 'number';
    qty.min = '1';
    qty.max = String(count);
    // Defaults to a stack, or everything there is if that's less.
    qty.value = withdrawCounts[item] !== undefined ? withdrawCounts[item] : Math.min(count, 64);
    qty.oninput = () => { withdrawCounts[item] = qty.value; };

    const button = document.createElement('button');
    button.textContent = 'Withdraw';
    button.onclick = () => withdrawItem(item, parseInt(qty.value, 10));

    const actionCell = document.createElement('td');
    actionCell.className = 'withdraw-cell';
    actionCell.append(qty, button);

    const tr = document.createElement('tr');
    tr.append(nameCell, countCell, actionCell);
    body.appendChild(tr);
  }
}

async function refreshInventory() {
  const res = await fetch('/api/inventory');
  const data = await res.json();
  totals = data.totals || {};
  renderInventory();
}

async function refreshStatus() {
  const res = await fetch('/api/status');
  const data = await res.json();
  document.getElementById('statusText').textContent = data.status;
  document.getElementById('statusDot').className = 'dot' + (data.paused ? ' paused' : '');
  if (!wanderPending) {
    document.getElementById('wander').checked = !!data.wanderEnabled;
  }
  document.getElementById('queueText').textContent = data.queueSize + ' job(s) queued: ' + data.queue.join(', ');
  const warningEl = document.getElementById('warningText');
  if (data.lastWarning) {
    warningEl.textContent = 'Last warning: ' + data.lastWarning;
    warningEl.style.display = 'block';
  } else {
    warningEl.style.display = 'none';
  }
}

function setVal(id, value) {
  if (value !== undefined && value !== null) {
    document.getElementById(id).value = value;
  }
}

// Pre-fills the setup form with whatever was last saved, so clicking "Save setup" again
// (e.g. after only changing the input chest) doesn't blank out the other fields back to 0.
async function loadSetup() {
  const res = await fetch('/api/setup');
  const data = await res.json();
  if (data.region) {
    if (data.region.min) { setVal('minX', data.region.min.x); setVal('minY', data.region.min.y); setVal('minZ', data.region.min.z); }
    if (data.region.max) { setVal('maxX', data.region.max.x); setVal('maxY', data.region.max.y); setVal('maxZ', data.region.max.z); }
  }
  if (data.inputChest) { setVal('inX', data.inputChest.x); setVal('inY', data.inputChest.y); setVal('inZ', data.inputChest.z); }
  if (data.outputChest) { setVal('outX', data.outputChest.x); setVal('outY', data.outputChest.y); setVal('outZ', data.outputChest.z); }
}

loadSetup();
refreshInventory();
refreshStatus();
setInterval(refreshStatus, 3000);
setInterval(refreshInventory, 10000);
</script>
</body>
</html>
